name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
        python: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install partial-recall + dev + gemini extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gemini]"

      - name: Lint (ruff)
        run: |
          python -m ruff check src tests

      - name: Run tests (skip slow + live)
        run: |
          python -m pytest tests/ -v -m "not slow and not live" --tb=short

      - name: Doctor surface smoke (non-Windows)
        if: matrix.os != 'windows-2022'
        run: |
          partial-recall doctor || true
          partial-recall --version

  lockfile:
    name: uv lock --check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # uv.lock drifted twice without anyone noticing, because nothing
      # asked it. #42 caught a stale lock at release time. #54 found the
      # [docling] extra added in #50 with no relock. Neither showed up as
      # a test failure, and git reports no conflict for either shape.
      - name: Fail if uv.lock disagrees with pyproject.toml
        run: |
          uv lock --check

  mcp-versions:
    name: pytest (mcp ${{ matrix.mcp }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The dependency allows both SDK majors. mcp 2.0.0 renamed the Tool
        # input-schema field, so both must stay green or the rename is loose
        # again. See src/partial_recall/mcp/compat.py.
        mcp: ["<2", ">=2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install partial-recall + dev + gemini extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gemini]"
          python -m pip install "mcp${{ matrix.mcp }}"

      - name: Report the resolved mcp version
        run: python -c "import importlib.metadata as m; print(m.version('mcp'))"

      - name: Run tests (skip slow + live)
        run: |
          python -m pytest tests/ -q -m "not slow and not live" --tb=short
